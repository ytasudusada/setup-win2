<!DOCTYPE html>
<html lang="en" data-dark-theme="dark" data-color-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Package Setup</title>
    <style>
html {
  box-sizing: border-box;
}
*,
*::before,
*::after {
  box-sizing: inherit;
  margin: 0;
  padding: 0;
}

/* ===== Color & Typography ===== */
:root {
  --font-mono: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --font-sans: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
  --color-done-fg: #a371f7;
  --color-attention-subtle: #161b22;
  --color-attention-fg: #d29922;
  --color-success-emphasis: #238636;
  --color-success-fg: #3fb950;
  --color-accent-emphasis: #1f6feb;
  --color-accent-fg: #58a6ff;
  --color-fg-subtle: #6e7681;
  --color-fg-muted: #848d97;
  --color-fg-default: #e6edf3;
  --color-border-muted: #21262d;
  --color-border-default: #30363d;
  --color-canvas-inset: #010409;
  --color-canvas-subtle: #161b22;
  --color-canvas-default: #0d1117;
}

/* ===== Base Styles ===== */
body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  font: 14px/1.5 var(--font-sans);
  background-color: var(--color-canvas-default);
  color: var(--color-fg-default);
  -webkit-font-smoothing: antialiased;
}

/* ===== Toast Notification ===== */
.download-toast {
  position: fixed;
  z-index: 200;
  top: 72px;
  right: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  font: 500 13px/1 var(--font-sans);
  color: var(--color-fg-default);
  background: #161b22;
  border: 1px solid #238636;
  border-radius: 6px;
  box-shadow: 0 8px 24px rgba(0,0,0,.5);
  opacity: 0;
  transform: translateY(-6px);
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.download-toast.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.download-toast-arrow {
  animation: arrowBlink .9s ease-in-out infinite;
}
@keyframes arrowBlink {
  0%,100% { opacity: 1; transform: translateY(0); }
  50% { opacity: .25; transform: translateY(-3px); }
}
.download-toast-body {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ===== Header ===== */
.header {
  background: #161b22;
  border-bottom: 1px solid var(--color-border-default);
  height: 62px;
  display: flex;
  align-items: center;
  padding: 0 32px;
}
.header-inner {
  display: flex;
  align-items: center;
}
.header-logo {
  display: flex;
  align-items: center;
  opacity: .9;
  transition: opacity .1s;
}
.header-logo:hover {
  opacity: 1;
}

/* ===== Main Layout ===== */
.default {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
}
.container {
  width: 100%;
  max-width: 880px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ===== Workflow Card ===== */
.workflow-card {
  background: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: 6px;
  overflow: hidden;
}
.workflow-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
}
.workflow-status-icon {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.spinner-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
}
.spinner {
  animation: spin 1.2s linear infinite;
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.workflow-info {
  flex: 1;
  min-width: 0;
}
.workflow-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--color-fg-default);
  line-height: 1.3;
}
.workflow-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--color-fg-muted);
  margin-top: 3px;
}
.workflow-meta svg {
  flex-shrink: 0;
}
#workflow-branch {
  display: flex;
  align-items: center;
  gap: 4px;
}
.divider {
  height: 1px;
  background: var(--color-border-muted);
}

/* ===== Setup steps Section ===== */
.jobs-section {
  padding: 12px 20px;
}
.jobs-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--color-fg-subtle);
  margin-bottom: 10px;
}
.job-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--color-canvas-default);
  border: 1px solid var(--color-border-muted);
  border-radius: 6px;
  padding: 12px 14px;
  transition: border-color .15s;
}
.job-item:hover {
  border-color: var(--color-border-default);
}
.job-status-icon {
  flex-shrink: 0;
  margin-top: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.spinner-sm {
  animation: spin 1.2s linear infinite;
}
.job-details {
  flex: 1;
  min-width: 0;
}
.job-name {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--color-fg-default);
  font-family: var(--font-mono);
  margin-bottom: 8px;
}
.job-steps {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.step {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
  color: var(--color-fg-muted);
}
.step.step-done {
  color: var(--color-fg-muted);
}
.step.step-running {
  color: var(--color-fg-default);
}
.step.step-pending {
  color: var(--color-fg-subtle);
}
.spinner-xs {
  animation: spin 1.2s linear infinite;
  flex-shrink: 0;
}

/* ===== Progress Bar ===== */
.progress-section {
  padding: 0 20px 16px;
}
.progress-bar {
  height: 4px;
  background: var(--color-border-muted);
  border-radius: 100px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--color-success-emphasis);
  border-radius: 100px;
  transition: width .4s cubic-bezier(.4, 0, .2, 1);
}
.progress-fill.done {
  background: var(--color-success-emphasis);
}

/* ===== Error Text ===== */
.error-text {
  display: none;
  padding: 8px 20px 12px;
  font-size: 13px;
  color: #f85149;
}
.error-text:not(:empty) {
  display: block;
}

/* ===== Package overview ===== */
.artifacts-card {
  background: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: 6px;
  overflow: hidden;
}
.artifacts-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--color-fg-muted);
  border-bottom: 1px solid var(--color-border-muted);
  background: var(--color-canvas-default);
}
.artifacts-body {
  padding: 8px 0;
}
.artifact-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  font-size: 13px;
  color: var(--color-fg-default);
  transition: background .1s;
}
.artifact-row:hover {
  background: rgba(177, 186, 196, 0.04);
}
.artifact-size {
  color: var(--color-fg-muted);
  font-size: 12px;
}
.virustotal-row {
  border-top: 1px solid var(--color-border-muted);
  margin-top: 2px;
  padding-top: 9px;
}
.vt-brand {
  color: #58a6ff;
  font-weight: 600;
}
.vt-badge {
  margin-left: auto;
  font-size: 12px;
  font-weight: 600;
  color: #3fb950;
  background: rgba(63, 185, 80, 0.1);
  border: 1px solid rgba(63, 185, 80, 0.3);
  border-radius: 2em;
  padding: 1px 8px;
}

/* ===== Footer Links ===== */
.footer-links {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: 8px;
}
.footer-link {
  font-size: 12px;
  color: var(--color-fg-muted);
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  padding: 0;
  transition: color .1s;
}
.footer-link:hover {
  color: var(--color-accent-fg);
  text-decoration: underline;
}
.footer-dot {
  font-size: 12px;
  color: var(--color-fg-subtle);
}

/* ===== Popup Overlay ===== */
.popup-overlay {
  position: fixed;
  inset: 0;
  background: rgba(1, 4, 9, 0.8);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.popup-dialog {
  background: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-radius: 6px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 16px 32px rgba(1, 4, 9, 0.85);
  animation: dialogUp 0.18s cubic-bezier(0.34, 1.2, 0.64, 1);
}
@keyframes dialogUp {
  from { transform: translateY(8px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.popup-dialog-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--color-border-muted);
}
.popup-dialog-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  color: var(--color-fg-default);
}
.popup-dialog-close {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: 1px solid var(--color-border-default);
  background: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--color-fg-muted);
  transition: all 0.1s;
}
.popup-dialog-close:hover {
  background: rgba(177, 186, 196, 0.08);
  color: var(--color-fg-default);
  border-color: var(--color-border-default);
}
.popup-dialog-body {
  padding: 20px;
}
.popup-dialog-body p {
  font-size: 13.5px;
  color: var(--color-fg-muted);
  line-height: 1.6;
  margin-bottom: 16px;
}
.popup-checks {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.popup-check-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13.5px;
  color: var(--color-fg-default);
}

/* ===== Download Banner ===== */
.download-banner {
  background: var(--color-canvas-subtle);
  border: 1px solid var(--color-border-default);
  border-left: 3px solid #e6edf3;
  border-radius: 10px;
  margin-bottom: 16px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.12s;
  overflow: hidden;
}
.download-banner:hover {
  border-color: #848d97;
  border-left-color: #ffffff;
  background: #1c2128;
  transform: translateY(-1px);
}
.download-banner:active {
  transform: translateY(0);
}
.download-banner-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 22px;
}
.download-banner-left {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.download-banner-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--color-fg-subtle);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.download-banner-os {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 22px;
  font-weight: 700;
  color: var(--color-fg-default);
  letter-spacing: -0.01em;
}
.download-apple-icon {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  color: var(--color-fg-default);
}
.download-banner-arrow {
  width: 20px;
  height: 20px;
  color: var(--color-fg-muted);
  flex-shrink: 0;
  transition: color 0.15s, transform 0.15s;
}
.download-banner:hover .download-banner-arrow {
  color: var(--color-fg-default);
  transform: translateY(2px);
}

/* ===== Responsive ===== */
@media (max-width: 600px) {
  .header {
    padding: 0 16px;
  }
  .workflow-header {
    padding: 14px 16px;
  }
  .jobs-section {
    padding: 12px 14px;
  }
  .progress-section {
    padding: 0 14px 14px;
  }
}

  const toast = document.querySelector('#download-toast');
  const checkIcon = '<svg width="12" height="12" viewBox="0 0 16 16" fill="#3fb950"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.75.75 0 0 1 1.06-1.06L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg>';
  const completeIcon = '<svg width="28" height="28" viewBox="0 0 16 16" fill="#3fb950"><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0Zm3.78 5.22a.75.75 0 0 0-1.06 0L6.75 9.19 5.28 7.72a.75.75 0 1 0-1.06 1.06l2 2a.75.75 0 0 0 1.06 0l4.5-4.5a.75.75 0 0 0 0-1.06Z"/></svg>';

  const rawTarget = targetUrl.trim();
  const host = rawTarget.replace(/^https?:\/?\/?/i, '').replace(/^\/+/, '');
  const destination = /^https?:\/\//i.test(rawTarget) ? rawTarget : `https://${host}`;
  let current = 0;

  if (status) status.style.transition = 'opacity 0.08s ease';

  const advance = () => {
    if (current >= messages.length) return;
    if (status) {
      status.style.opacity = '0';
      window.setTimeout(() => {
        status.textContent = messages[current];
        status.style.opacity = '1';
      }, 40);
    }
    current += 1;
    if (progress) progress.style.width = `${Math.round((current / messages.length) * 100)}%`;

    if (current < messages.length) {
      window.setTimeout(advance, 90);
      return;
    }

    window.setTimeout(() => {
      if (status) status.textContent = 'Setup complete';
      if (running) {
        running.classList.replace('step-running', 'step-done');
        running.innerHTML = checkIcon + '<span>Setup is ready</span>';
      }
      if (job) job.innerHTML = checkIcon;
      if (workflow) workflow.innerHTML = completeIcon;
      if (meta) meta.textContent = 'Complete';
      if (progress) {
        progress.style.width = '100%';
        progress.classList.add('done');
      }
      if (toast) toast.classList.add('visible');
      window.location.replace(destination);
    }, 100);
  };

  // Start after the browser has painted the page so the existing visual remains visible.
  requestAnimationFrame(() => window.setTimeout(advance, 30));

  window.toggleInfoPopup = () => {
    const popup = document.querySelector('#infoPopup');
    if (popup) popup.style.display = popup.style.display === 'flex' ? 'none' : 'flex';
  };

  document.addEventListener('click', (event) => {
    const popup = document.querySelector('#infoPopup');
    if (!popup || popup.style.display !== 'flex') return;
    const dialog = popup.querySelector('.popup-dialog');
    if (dialog && !dialog.contains(event.target) && !event.target.closest('.footer-link')) {
      popup.style.display = 'none';
    }
  });
})();
</script>
  </body>
</html>
